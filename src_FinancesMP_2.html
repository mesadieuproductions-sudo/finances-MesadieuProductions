// Collision-resistant ID generator (falls back gracefully if crypto.randomUUID
// isn't available). Using Date.now() alone risked duplicate React keys when
// two records were created within the same millisecond.
function generateId() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
}

// Parses a single CSV line into fields, correctly handling quoted fields
// (including embedded commas and escaped "" quotes) as well as plain
// unquoted fields that contain spaces — the previous regex-based approach
// dropped/mis-split unquoted multi-word fields like an unquoted "Grocery Store".
function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (inQuotes) {
      if (char === '"') {
        if (line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        current += char;
      }
    } else {
      if (char === '"') {
        inQuotes = true;
      } else if (char === ',') {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
  }
  result.push(current);
  return result;
}

function CashFlowChart({ income, expenses, lang }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const t = translations[lang];

  useEffect(() => {
    if (!chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');
    
    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    chartInstance.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: [t.income, t.expense],
        datasets: [{
          data: [income, expenses],
          backgroundColor: ['#10b981', '#f43f5e'],
          borderRadius: 8,
          barThickness: 28
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } }
        }
      }
    });

    return () => {
      if (chartInstance.current) {
        chartInstance.current.destroy();
        chartInstance.current = null;
      }
    };
  }, [income, expenses, lang]);

  return (
    <div className="h-36 sm:h-44 w-full">
      <canvas ref={chartRef}></canvas>
    </div>
  );
}

function ProjectedVsActualChart({ actualExpense, projectedExpense, chartType, lang }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const t = translations[lang];

  useEffect(() => {
    if (!chartRef.current) return;
    const ctx = chartRef.current.getContext('2d');

    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    const isPie = chartType === 'pie';

    chartInstance.current = new Chart(ctx, {
      type: isPie ? 'doughnut' : 'bar',
      data: {
        labels: [t.actualSpent, t.pendingScheduled],
        datasets: [{
          label: 'Amount ($)',
          data: [actualExpense, projectedExpense],
          backgroundColor: ['#f43f5e', '#fbbf24'],
          borderRadius: isPie ? 0 : 8,
          barThickness: isPie ? undefined : 32,
          borderWidth: isPie ? 2 : 0,
          borderColor: '#1e293b'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: isPie,
            position: 'bottom',
            labels: {
              color: '#cbd5e1',
              font: { family: 'Plus Jakarta Sans', size: 11 },
              padding: 12
            }
          },
          tooltip: {
            callbacks: {
              label: (context) => `$${context.raw.toLocaleString(undefined, { minimumFractionDigits: 2 })}`
            }
          }
        },
        scales: isPie ? {} : {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } }
        }
      }
    });

    return () => {
      if (chartInstance.current) {
        chartInstance.current.destroy();
        chartInstance.current = null;
      }
    };
  }, [actualExpense, projectedExpense, chartType, lang]);

  return (
    <div className="h-44 sm:h-52 w-full flex items-center justify-center">
      <canvas ref={chartRef}></canvas>
    </div>
  );
}

function MonthlyTrendChart({ transactions, lang }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const t = translations[lang];

  // Group transactions by YYYY-MM, then take the last 6 months that have
  // any activity (chronological order), so the trend reads left-to-right oldest to newest.
  const monthMap = {};
  transactions.forEach(tx => {
    if (!tx.date) return;
    const key = tx.date.slice(0, 7); // "YYYY-MM"
    if (!monthMap[key]) monthMap[key] = { income: 0, expense: 0 };
    if (tx.type === 'income') monthMap[key].income += Number(tx.amount);
    else monthMap[key].expense += Number(tx.amount);
  });

  const sortedKeys = Object.keys(monthMap).sort();
  const lastSixKeys = sortedKeys.slice(-6);

  const monthLabel = (key) => {
    const [y, m] = key.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, 1)).toLocaleString(lang === 'ht' ? 'fr-FR' : 'default', { month: 'short', year: '2-digit', timeZone: 'UTC' });
  };

  const labels = lastSixKeys.map(monthLabel);
  const incomeData = lastSixKeys.map(k => monthMap[k].income);
  const expenseData = lastSixKeys.map(k => monthMap[k].expense);

  useEffect(() => {
    if (!chartRef.current || lastSixKeys.length === 0) return;
    const ctx = chartRef.current.getContext('2d');

    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    chartInstance.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: t.income,
            data: incomeData,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.15)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
            pointBackgroundColor: '#10b981'
          },
          {
            label: t.expense,
            data: expenseData,
            borderColor: '#f43f5e',
            backgroundColor: 'rgba(244, 63, 94, 0.15)',
            tension: 0.3,
            fill: true,
            pointRadius: 3,
            pointBackgroundColor: '#f43f5e'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: 'bottom',
            labels: { color: '#cbd5e1', font: { family: 'Plus Jakarta Sans', size: 11 }, padding: 12, boxWidth: 12 }
          },
          tooltip: {
            callbacks: {
              label: (context) => `${context.dataset.label}: $${context.raw.toLocaleString(undefined, { minimumFractionDigits: 2 })}`
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } } }
        }
      }
    });

    return () => {
      if (chartInstance.current) {
        chartInstance.current.destroy();
        chartInstance.current = null;
      }
    };
  }, [JSON.stringify(lastSixKeys), JSON.stringify(incomeData), JSON.stringify(expenseData), lang]);

  if (lastSixKeys.length < 2) {
    return (
      <div className="h-36 sm:h-44 w-full flex items-center justify-center text-center text-xs text-slate-500 px-4">
        {t.notEnoughTrendData}
      </div>
    );
  }

  return (
    <div className="h-36 sm:h-44 w-full">
      <canvas ref={chartRef}></canvas>
    </div>
  );
}

  useEffect(() => {
    try { localStorage.setItem('hfh_transactions', JSON.stringify(transactions)); } catch (e) {}
  }, [transactions]);

  useEffect(() => {
    try { localStorage.setItem('hfh_scheduled', JSON.stringify(scheduledItems)); } catch (e) {}
  }, [scheduledItems]);

  useEffect(() => {
    try { localStorage.setItem('hfh_savings', JSON.stringify(savingsGoals)); } catch (e) {}
  }, [savingsGoals]);

  useEffect(() => {
    try { localStorage.setItem('hfh_accounts', JSON.stringify(accounts)); } catch (e) {}
  }, [accounts]);

  useEffect(() => {
    try { localStorage.setItem('hfh_budgets', JSON.stringify(budgets)); } catch (e) {}
  }, [budgets]);

  useEffect(() => {
    try { localStorage.setItem('hfh_processed_occurrences', JSON.stringify(processedOccurrences)); } catch (e) {}
  }, [processedOccurrences]);

  const handleResetData = () => {
    if (window.confirm(t.confirmReset)) {
      setTransactions([]);
      setScheduledItems([]);
      setSavingsGoals([]);
      setAccounts([]);
      setBudgets([]);
      setProcessedOccurrences([]);
      
      localStorage.removeItem('hfh_transactions');
      localStorage.removeItem('hfh_scheduled');
      localStorage.removeItem('hfh_savings');
      localStorage.removeItem('hfh_accounts');
      localStorage.removeItem('hfh_budgets');
      localStorage.removeItem('hfh_processed_occurrences');
      
      alert(t.resetSuccess);
    }
  };

  const year = currentCalendarDate.getFullYear();
  const month = currentCalendarDate.getMonth();
  const firstDayOfMonth = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const prevMonth = () => setCurrentCalendarDate(new Date(year, month - 1, 1));
  const nextMonth = () => setCurrentCalendarDate(new Date(year, month + 1, 1));

  const doesItemOccurOnDate = (item, targetDateStr) => {
    if (!item.startDate) return false;
    
    const [sYear, sMonth, sDay] = item.startDate.split('-').map(Number);
    const [tYear, tMonth, tDay] = targetDateStr.split('-').map(Number);
    
    const start = Date.UTC(sYear, sMonth - 1, sDay);
    const target = Date.UTC(tYear, tMonth - 1, tDay);

    if (target < start) return false;

    const freq = item.frequency || 'monthly';

    if (freq === 'monthly') {
      // Clamp to the last day of the target month so a bill started on the
      // 29th/30th/31st still fires in shorter months (e.g. Feb) instead of
      // silently never occurring.
      const lastDayOfTargetMonth = new Date(Date.UTC(tYear, tMonth, 0)).getUTCDate();
      const effectiveDay = Math.min(sDay, lastDayOfTargetMonth);
      return tDay === effectiveDay;
    } 
    
    const diffDays = Math.round((target - start) / (1000 * 3600 * 24));

    if (freq === 'biweekly') {
      return diffDays % 14 === 0;
    } else if (freq === 'weekly') {
      return diffDays % 7 === 0;
    }
    return false;
  };

  const getCalendarDayItems = (dayNum) => {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
    
    const actual = transactions.filter(t => t.date === dateStr);
    
    const scheduled = scheduledItems.filter(s => doesItemOccurOnDate(s, dateStr)).map(s => ({
      ...s,
      instanceKey: `${s.id}_${dateStr}`,
      isProcessed: processedOccurrences.includes(`${s.id}_${dateStr}`)
    }));

    const actualIncome = actual.filter(a => a.type === 'income').reduce((acc, a) => acc + Number(a.amount), 0);
    const actualExpense = actual.filter(a => a.type === 'expense').reduce((acc, a) => acc + Number(a.amount), 0);
    
    const schedIncome = scheduled.filter(s => !s.isProcessed && s.type === 'income').reduce((acc, s) => acc + Number(s.amount), 0);
    const schedExpense = scheduled.filter(s => !s.isProcessed && s.type === 'expense').reduce((acc, s) => acc + Number(s.amount), 0);

    return { dateStr, actual, scheduled, actualIncome, actualExpense, schedIncome, schedExpense };
  };

  // Scoped to whichever month is currently displayed in the Bills tab calendar.
  let pendingBills = 0;
  let pendingIncome = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const dayData = getCalendarDayItems(d);
    pendingBills += dayData.schedExpense;
    pendingIncome += dayData.schedIncome;
  }

  const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + Number(t.amount), 0);
  const totalExpenses = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + Number(t.amount), 0);
  const leftoverCash = totalIncome - totalExpenses;
  // Bills-tab-only figure: pairs with the calendar month currently shown there.
  const projectedBalance = leftoverCash + pendingIncome - pendingBills;
  const totalProjectedExpense = totalExpenses + pendingBills;

  // App-wide "Projected Cash" header stat: intentionally independent of which
  // month the Bills tab calendar happens to be showing, so paging the calendar
  // doesn't change a number visible on every tab. Uses a fixed rolling window
  // from today instead.
  const PROJECTION_WINDOW_DAYS = 30;
  let upcomingBills = 0;
  let upcomingIncome = 0;
  for (let i = 0; i < PROJECTION_WINDOW_DAYS; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const dStr = d.toISOString().split('T')[0];
    scheduledItems.forEach(s => {
      if (!doesItemOccurOnDate(s, dStr)) return;
      if (processedOccurrences.includes(`${s.id}_${dStr}`)) return;
      if (s.type === 'income') upcomingIncome += Number(s.amount);
      else upcomingBills += Number(s.amount);
    });
  }
  const globalProjectedBalance = leftoverCash + upcomingIncome - upcomingBills;

  const totalSaved = savingsGoals.reduce((acc, g) => acc + Number(g.current), 0);
  const spentPercentage = totalIncome > 0 ? Math.min(100, Math.round((totalExpenses / totalIncome) * 100)) : 0;

  // Net Worth: manually-tracked account balances (checking, savings, investments,
  // credit cards, loans, etc). This is intentionally separate from the
  // transaction-based leftoverCash/projectedBalance figures above — those model
  // cash flow from logged transactions, while accounts here model real-world
  // balances the user enters directly, so the two aren't double-counted together.
  const totalAssets = accounts.filter(a => a.classification === 'asset').reduce((acc, a) => acc + Number(a.balance), 0);
  const totalLiabilities = accounts.filter(a => a.classification === 'liability').reduce((acc, a) => acc + Number(a.balance), 0);
  const netWorth = totalAssets - totalLiabilities;

  // Upcoming bill/income reminders: scans a fixed 7-day window from today
  // (independent of whichever month the Bills tab calendar is showing) and
  // lists individual unprocessed occurrences, soonest first.
  const REMINDER_WINDOW_DAYS = 7;
  const upcomingReminders = [];
  for (let i = 0; i < REMINDER_WINDOW_DAYS; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const dStr = d.toISOString().split('T')[0];
    scheduledItems.forEach(s => {
      if (!doesItemOccurOnDate(s, dStr)) return;
      const instanceKey = `${s.id}_${dStr}`;
      if (processedOccurrences.includes(instanceKey)) return;
      upcomingReminders.push({ ...s, dateStr: dStr, daysUntil: i, instanceKey });
    });
  }
  upcomingReminders.sort((a, b) => a.daysUntil - b.daysUntil);

  const getDueLabel = (daysUntil) => {
    if (daysUntil === 0) return t.dueToday;
    if (daysUntil === 1) return t.dueTomorrow;
    return `${t.dueIn} ${daysUntil} ${t.daysUnit}`;
  };

  // Budgets: monthly caps per expense category, checked against actual
  // expense transactions logged in the current real-world calendar month
  // (independent of whichever month the Bills tab calendar is browsing).
  const now = new Date();
  const curBudgetYear = now.getFullYear();
  const curBudgetMonth = now.getMonth();
  const currentMonthSpendByCategory = {};
  transactions.forEach(tx => {
    if (tx.type !== 'expense' || !tx.date) return;
    const [txYear, txMonth] = tx.date.split('-').map(Number);
    if (txYear === curBudgetYear && (txMonth - 1) === curBudgetMonth) {
      currentMonthSpendByCategory[tx.category] = (currentMonthSpendByCategory[tx.category] || 0) + Number(tx.amount);
    }
  });

  const budgetStatuses = budgets.map(b => {
    const spent = currentMonthSpendByCategory[b.category] || 0;
    const pct = b.limit > 0 ? (spent / b.limit) * 100 : 0;
    let status = 'onTrack';
    if (pct >= 100) status = 'over';
    else if (pct >= 80) status = 'close';
    return { ...b, spent, pct: Math.min(100, pct), rawPct: pct, status };
  });

  const handleCreateSavingsGoal = (e) => {
    e.preventDefault();
    if (!goalForm.name || !goalForm.target) return;

    const targetVal = parseFloat(goalForm.target);
    const currentVal = parseFloat(goalForm.current) || 0;
    if (isNaN(targetVal) || targetVal <= 0 || currentVal < 0) return;

    const newGoal = {
      id: generateId(),
      name: goalForm.name,
      target: targetVal,
      current: currentVal,
      icon: 'fa-piggy-bank'
    };

    setSavingsGoals(prev => [...prev, newGoal]);
    setGoalForm({ name: '', target: '', current: '' });
  };

  const handleGoalActionSubmit = (e) => {
    e.preventDefault();
    if (!activeGoalModal || !modalAmount) return;

    const amount = parseFloat(modalAmount);
    if (isNaN(amount) || amount <= 0) return;

    const targetGoal = savingsGoals.find(g => g.id === activeGoalModal.goalId);
    if (!targetGoal) return;

    if (activeGoalModal.action === 'deposit') {
      setSavingsGoals(prev => prev.map(g => g.id === targetGoal.id ? { ...g, current: g.current + amount } : g));

      setTransactions(prev => [{
        id: generateId(),
        description: `${lang === 'ht' ? 'Transfè nan Ekonomi:' : 'Savings Transfer:'} ${targetGoal.name}`,
        amount: amount,
        category: 'Savings',
        type: 'expense',
        date: new Date().toISOString().split('T')[0]
      }, ...prev]);
    } else if (activeGoalModal.action === 'borrow') {
      if (amount > targetGoal.current) {
        alert(t.borrowError);
        return;
      }
      setSavingsGoals(prev => prev.map(g => g.id === targetGoal.id ? { ...g, current: g.current - amount } : g));

      setTransactions(prev => [{
        id: generateId(),
        description: `${lang === 'ht' ? 'Retire nan' : 'Borrowed from'} ${targetGoal.name}`,
        amount: amount,
        category: 'Savings',
        type: 'income',
        date: new Date().toISOString().split('T')[0]
      }, ...prev]);
    }

    setActiveGoalModal(null);
    setModalAmount('');
  };

  const handleDeleteGoal = (id) => {
    setSavingsGoals(prev => prev.filter(g => g.id !== id));
  };

  const ACCOUNT_TYPES_BY_CLASSIFICATION = {
    asset: ['checking', 'savings', 'cash', 'investment', 'other'],
    liability: ['credit', 'loan', 'other']
  };

  const accountTypeLabel = (type) => {
    switch (type) {
      case 'checking': return t.accountTypeChecking;
      case 'savings': return t.accountTypeSavings;
      case 'cash': return t.accountTypeCash;
      case 'investment': return t.accountTypeInvestment;
      case 'credit': return t.accountTypeCredit;
      case 'loan': return t.accountTypeLoan;
      default: return t.accountTypeOther;
    }
  };

  const handleSaveAccount = (e) => {
    e.preventDefault();
    if (!accountForm.name || !accountForm.balance) return;

    const balanceVal = Math.abs(parseFloat(accountForm.balance));
    if (isNaN(balanceVal)) return;

    if (editingAccountId) {
      setAccounts(prev => prev.map(a => a.id === editingAccountId ? {
        ...a,
        name: accountForm.name,
        balance: balanceVal,
        classification: accountForm.classification,
        type: accountForm.type
      } : a));
      setEditingAccountId(null);
    } else {
      const newAccount = {
        id: generateId(),
        name: accountForm.name,
        balance: balanceVal,
        classification: accountForm.classification,
        type: accountForm.type
      };
      setAccounts(prev => [...prev, newAccount]);
    }
    setAccountForm({ name: '', balance: '', classification: 'asset', type: 'checking' });
  };

  const handleEditAccountClick = (account) => {
    setEditingAccountId(account.id);
    setAccountForm({
      name: account.name,
      balance: account.balance,
      classification: account.classification,
      type: account.type
    });
  };

  const handleCancelAccountEdit = () => {
    setEditingAccountId(null);
    setAccountForm({ name: '', balance: '', classification: 'asset', type: 'checking' });
  };

  const handleDeleteAccount = (id) => {
    setAccounts(prev => prev.filter(a => a.id !== id));
    if (editingAccountId === id) handleCancelAccountEdit();
  };

  const handleAccountClassificationChange = (classification) => {
    setAccountForm({
      ...accountForm,
      classification,
      type: ACCOUNT_TYPES_BY_CLASSIFICATION[classification][0]
    });
  };

  const BUDGET_CATEGORIES = ['General Expense', 'Credit Card', 'Subscription', 'Utilities', 'Savings'];

  const budgetCategoryLabel = (category) => {
    switch (category) {
      case 'General Expense': return t.generalExpense;
      case 'Credit Card': return t.creditCard;
      case 'Subscription': return t.subscription;
      case 'Utilities': return t.utilities;
      case 'Savings': return t.savingsTransfer;
      default: return category;
    }
  };

  const handleSaveBudget = (e) => {
    e.preventDefault();
    if (!budgetForm.category || !budgetForm.limit) return;

    const limitVal = Math.abs(parseFloat(budgetForm.limit));
    if (isNaN(limitVal) || limitVal <= 0) return;

    if (editingBudgetId) {
      setBudgets(prev => prev.map(b => b.id === editingBudgetId ? { ...b, category: budgetForm.category, limit: limitVal } : b));
      setEditingBudgetId(null);
    } else {
      // One budget per category — adding a category that already has a
      // budget updates its limit instead of creating a duplicate row.
      setBudgets(prev => {
        const existing = prev.find(b => b.category === budgetForm.category);
        if (existing) {
          return prev.map(b => b.id === existing.id ? { ...b, limit: limitVal } : b);
        }
        return [...prev, { id: generateId(), category: budgetForm.category, limit: limitVal }];
      });
    }
    setBudgetForm({ category: 'General Expense', limit: '' });
  };

  const handleEditBudgetClick = (budget) => {
    setEditingBudgetId(budget.id);
    setBudgetForm({ category: budget.category, limit: budget.limit });
  };

  const handleCancelBudgetEdit = () => {
    setEditingBudgetId(null);
    setBudgetForm({ category: 'General Expense', limit: '' });
  };

  const handleDeleteBudget = (id) => {
    setBudgets(prev => prev.filter(b => b.id !== id));
    if (editingBudgetId === id) handleCancelBudgetEdit();
  };

  const handleExportCSV = () => {
    if (transactions.length === 0) {
      alert(t.exportError);
      return;
    }

    const headers = ["Description", "Amount", "Category", "Type", "Date"];
    const rows = transactions.map(t => [
      `"${(t.description || '').replace(/"/g, '""')}"`,
      t.amount,
      `"${t.category}"`,
      t.type,
      t.date
    ]);

    const csvContent = "data:text/csv;charset=utf-8," 
      + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `finance_hub_transactions_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const handleImportCSV = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (evt) => {
      const text = evt.target.result;
      const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
      if (lines.length <= 1) {
        alert(t.importEmptyError);
        return;
      }

      const importedTransactions = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols && cols.length >= 2) {
          const cleanCol = (col) => col ? col.trim() : '';

          const description = cleanCol(cols[0]) || 'Imported Entry';
          const amountVal = parseFloat(cleanCol(cols[1]).replace(/[\$,]/g, ''));
          const category = cleanCol(cols[2]) || (amountVal < 0 ? 'General Expense' : 'Income');
          const typeVal = cleanCol(cols[3]).toLowerCase();
          
          let type = 'expense';
          if (typeVal === 'income' || amountVal > 0) {
            type = 'income';
          } else if (typeVal === 'expense' || amountVal < 0) {
            type = 'expense';
          }

          const date = cleanCol(cols[4]) || new Date().toISOString().split('T')[0];

          if (!isNaN(amountVal)) {
            importedTransactions.push({
              id: generateId(),
              description,
              amount: Math.abs(amountVal),
              category,
              type,
              date
            });
          }
        }
      }

      if (importedTransactions.length > 0) {
        setTransactions(prev => [...importedTransactions, ...prev]);
        alert(`${t.importSuccess} ${importedTransactions.length} ${t.importSuccessCount}`);
      } else {
        alert(t.importParseError);
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  const ALLOWED_RECEIPT_CATEGORIES = ['General Expense', 'Credit Card', 'Subscription', 'Utilities', 'Savings'];
  const [receiptDate, setReceiptDate] = useState(null);

  const handleReceiptFile = (e) => {
    const file = e.target.files[0];
    e.target.value = ''; // allow re-selecting the same file next time
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      setReceiptStatus({ type: 'error', message: t.receiptError });
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const [header, base64Data] = dataUrl.split(',');
      const mediaTypeMatch = header.match(/data:(.*?);base64/);
      const mediaType = mediaTypeMatch ? mediaTypeMatch[1] : 'image/jpeg';
      processReceiptImage(base64Data, mediaType);
    };
    reader.onerror = () => {
      setReceiptStatus({ type: 'error', message: t.receiptScanFailed });
    };
    reader.readAsDataURL(file);
  };

  const processReceiptImage = async (base64Data, mediaType) => {
    setReceiptProcessing(true);
    setReceiptStatus(null);

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [
            {
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
                {
                  type: "text",
                  text: `You are reading a photo of a purchase receipt for a personal finance app. Respond with ONLY a raw JSON object - no markdown fences, no extra text - in exactly this shape:
{"description": string, "amount": number or null, "date": "YYYY-MM-DD" or null, "category": one of "General Expense", "Credit Card", "Subscription", "Utilities", "Savings"}

Rules:
- "description" is the merchant/store name (or a short purchase description if no merchant name is visible), 40 characters max.
- "amount" is the final total paid, as a plain number with no currency symbol. If you cannot confidently identify the total, use null.
- "date" is the purchase date shown on the receipt in YYYY-MM-DD format. If no date is visible, use null. Never use a future date.
- "category" must be exactly one of the four allowed values above, chosen as your best guess for what kind of purchase this is. Default to "General Expense" if unsure.
- If the image is not a receipt at all, still return the JSON shape with "amount": null and "description": "Unrecognized receipt".`
                }
              ]
            }
          ]
        })
      });

      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if (!textBlock) throw new Error('No text response from receipt scan');

      const cleaned = textBlock.text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);

      const amountVal = parseFloat(parsed.amount);
      if (!parsed.amount || isNaN(amountVal) || amountVal <= 0) {
        setReceiptStatus({ type: 'error', message: t.receiptError });
        setReceiptProcessing(false);
        return;
      }

      const category = ALLOWED_RECEIPT_CATEGORIES.includes(parsed.category) ? parsed.category : 'General Expense';
      const description = (parsed.description || '').toString().trim().slice(0, 60) || 'Receipt';

      let validDate = null;
      if (parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date)) {
        const parsedDate = new Date(parsed.date + 'T00:00:00');
        if (!isNaN(parsedDate.getTime()) && parsedDate <= new Date()) {
          validDate = parsed.date;
        }
      }
      setReceiptDate(validDate);

      setEditingId(null);
      setTransForm({
        description,
        amount: amountVal.toFixed(2),
        category,
        type: 'expense'
      });
      setReceiptStatus({ type: 'success', message: t.receiptProcessed });
    } catch (err) {
      setReceiptStatus({ type: 'error', message: t.receiptScanFailed });
    } finally {
      setReceiptProcessing(false);
    }
  };

                      </div>
                    </div>
                    <div className={`text-base font-black ${account.classification === 'liability' ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {account.classification === 'liability' ? '-' : ''}${Number(account.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        )}

        {/* Tab: Scheduled Bills & Income + Calendar */}
        {activeTab === 'bills' && (
          <div className="space-y-4">

            <div className="glass-card p-3.5 rounded-2xl bg-gradient-to-r from-slate-900 via-indigo-950/40 to-slate-900 border border-indigo-500/20 space-y-2">
              <div className="flex justify-between items-center border-b border-slate-800/80 pb-2">
                <h3 className="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                  <i className="fa-solid fa-calculator"></i> {t.scheduledProjectionMath} ({currentCalendarDate.toLocaleString(lang === 'ht' ? 'fr-FR' : 'default', { month: 'short' })})
                </h3>

                <div className="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                  <button
                    onClick={() => setSchedViewMode('calendar')}
                    className={`px-2.5 py-1 rounded-md text-[10px] font-bold transition-all ${
                      schedViewMode === 'calendar' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-calendar-days mr-1"></i> {t.calendar}
                  </button>
                  <button
                    onClick={() => setSchedViewMode('list')}
                    className={`px-2.5 py-1 rounded-md text-[10px] font-bold transition-all ${
                      schedViewMode === 'list' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-list-check mr-1"></i> {t.list}
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center text-xs pt-1">
                <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-slate-400 block uppercase font-bold">{t.leftoverCash}</span>
                  <span className="font-bold text-slate-200">${leftoverCash.toFixed(2)}</span>
                </div>
                <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-rose-400 block uppercase font-bold">{t.pendingBills}</span>
                  <span className="font-bold text-rose-400">-${pendingBills.toFixed(2)}</span>
                </div>
                <div className="bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-emerald-400 block uppercase font-bold">{t.pendingIncome}</span>
                  <span className="font-bold text-emerald-400">+${pendingIncome.toFixed(2)}</span>
                </div>
              </div>
              <div className="flex justify-between items-center pt-1 border-t border-slate-800/80 text-xs font-bold">
                <span className="text-slate-300">{t.projectedCashLeft}</span>
                <span className={projectedBalance >= 0 ? 'text-cyan-300 text-sm' : 'text-rose-400 text-sm'}>
                  ${projectedBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                </span>
              </div>
            </div>

            <div className="glass-card p-3.5 sm:p-4 rounded-2xl space-y-3 border border-indigo-500/20">
              <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 className="text-xs sm:text-sm font-bold flex items-center gap-2 text-slate-200">
                  <i className="fa-solid fa-chart-pie text-amber-400"></i> {t.projectedVsActual}
                </h2>
                <div className="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                  <button
                    onClick={() => setExpenseChartType('bar')}
                    className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${
                      expenseChartType === 'bar' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-chart-simple mr-1"></i> {t.bar}
                  </button>
                  <button
                    onClick={() => setExpenseChartType('pie')}
                    className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${
                      expenseChartType === 'pie' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <i className="fa-solid fa-chart-pie mr-1"></i> {t.pie}
                  </button>
                </div>
              </div>

              <ProjectedVsActualChart
                actualExpense={totalExpenses}
                projectedExpense={pendingBills}
                chartType={expenseChartType}
                lang={lang}
              />

              <div className="grid grid-cols-3 gap-2 pt-1 border-t border-slate-800/80 text-center text-xs">
                <div className="bg-slate-900/40 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-slate-400 uppercase font-bold block">{t.actualSpent}</span>
                  <span className="font-bold text-rose-400">${totalExpenses.toFixed(2)}</span>
                </div>
                <div className="bg-slate-900/40 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-slate-400 uppercase font-bold block">{t.pendingScheduled}</span>
                  <span className="font-bold text-amber-400">${pendingBills.toFixed(2)}</span>
                </div>
                <div className="bg-slate-900/40 p-2 rounded-xl border border-slate-800">
                  <span className="text-[9px] text-slate-400 uppercase font-bold block">{t.totalProjected}</span>
                  <span className="font-bold text-indigo-300">${totalProjectedExpense.toFixed(2)}</span>
                </div>
              </div>
            </div>

            <div className="glass-card p-3.5 sm:p-4 rounded-2xl space-y-3">
              <h2 className="text-xs sm:text-sm font-bold flex items-center justify-between border-b border-slate-800 pb-2">
                <span>
                  <i className={`fa-solid ${editingSchedId ? 'fa-pen-to-square text-amber-400' : 'fa-calendar-plus text-indigo-400'} mr-1.5`}></i>
                  {editingSchedId ? t.editScheduledItem : t.scheduleRecurring}
                </span>
                {editingSchedId && (
                  <button onClick={handleCancelSchedEdit} className="text-xs text-slate-400 hover:text-white p-1">
                    {t.cancel}
                  </button>
                )}
              </h2>
              
              <form onSubmit={handleSaveScheduledItem} className="space-y-2.5">
                <div className="grid grid-cols-2 gap-2 mb-1">
                  <button
                    type="button"
                    onClick={() => setSchedForm({ ...schedForm, type: 'income', category: 'Income' })}
                    className={`py-2 rounded-xl text-xs font-bold transition-all ${
                      schedForm.type === 'income' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'
                    }`}
                  >
                    {t.scheduledIncome}
                  </button>
                  <button
                    type="button"
                    onClick={() => setSchedForm({ ...schedForm, type: 'expense', category: 'Subscription' })}
                    className={`py-2 rounded-xl text-xs font-bold transition-all ${
                      schedForm.type === 'expense' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'
                    }`}
                  >
                    {t.scheduledExpense}
                  </button>
                </div>

                <input
                  type="text"
                  placeholder={schedForm.type === 'income' ? t.incomeTitlePlaceholder : t.billTitlePlaceholder}
                  value={schedForm.name}
                  onChange={(e) => setSchedForm({ ...schedForm, name: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:outline-none"
                  required
                />

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <input
                    type="number"
                    step="0.01"
                    min="0.01"
                    placeholder={t.amountPlaceholder}
                    value={schedForm.amount}
                    onChange={(e) => setSchedForm({ ...schedForm, amount: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none"
                    required
                  />

                  <select
                    value={schedForm.frequency}
                    onChange={(e) => setSchedForm({ ...schedForm, frequency: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2.5 text-xs text-white focus:outline-none"
                  >
                    <option value="biweekly">{t.biweekly}</option>
                    <option value="monthly">{t.monthly}</option>
                    <option value="weekly">{t.weekly}</option>
                  </select>

                  <input
                    type="date"
                    value={schedForm.startDate}
                    onChange={(e) => setSchedForm({ ...schedForm, startDate: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none"
                    required
                  />

                  {schedForm.type === 'expense' ? (
                    <select
                      value={schedForm.category}
                      onChange={(e) => setSchedForm({ ...schedForm, category: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2.5 text-xs text-white focus:outline-none"
                    >
                      <option value="Subscription">{t.subscription}</option>
                      <option value="Credit Card">{t.creditCard}</option>
                      <option value="Utilities">{t.utilityOther}</option>
                    </select>
                  ) : (
                    <input
                      type="text"
                      value={t.income}
                      disabled
                      className="w-full bg-slate-900/50 border border-slate-800 text-slate-500 rounded-xl px-3 py-2.5 text-xs"
                    />
                  )}
                </div>

                <button 
                  type="submit" 
                  className={`w-full text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition-all ${
                    editingSchedId 
                      ? 'bg-amber-600 active:bg-amber-700' 
                      : schedForm.type === 'income' ? 'bg-emerald-600 active:bg-emerald-700' : 'bg-amber-600 active:bg-amber-700'
                  }`}
                >
                  {editingSchedId 
                    ? t.updateRecurring 
                    : (schedForm.type === 'income' ? t.addRecurringIncome : t.addRecurringExpense)}
                </button>
              </form>
            </div>

            {schedViewMode === 'calendar' && (
              <div className="glass-card p-3.5 sm:p-4 rounded-2xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <button onClick={prevMonth} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold">
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                  <div className="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-calendar text-indigo-400"></i>
                    {currentCalendarDate.toLocaleString(lang === 'ht' ? 'fr-FR' : 'default', { month: 'long', year: 'numeric' })}
                  </div>
                  <button onClick={nextMonth} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold">
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                </div>

                <div className="grid grid-cols-7 gap-1 text-center font-bold text-[10px] text-slate-400 border-b border-slate-800 pb-1">
                  <div>{t.sun}</div><div>{t.mon}</div><div>{t.tue}</div><div>{t.wed}</div><div>{t.thu}</div><div>{t.fri}</div><div>{t.sat}</div>
                </div>

                <div className="grid grid-cols-7 gap-1 sm:gap-1.5">
                  {Array.from({ length: firstDayOfMonth }).map((_, i) => (
                    <div key={`empty-${i}`} className="h-14 sm:h-16 rounded-xl bg-slate-900/30 border border-transparent"></div>
                  ))}

                  {Array.from({ length: daysInMonth }).map((_, i) => {
                    const dayNum = i + 1;
                    const dayData = getCalendarDayItems(dayNum);
                    const hasActivity = dayData.actual.length > 0 || dayData.scheduled.length > 0;

                    return (
                      <div
                        key={`day-${dayNum}`}
                        onClick={() => setSelectedCalendarDay(dayData)}
                        className={`h-14 sm:h-16 rounded-xl p-1 border transition-all cursor-pointer flex flex-col justify-between ${
                          hasActivity ? 'bg-slate-900/90 border-slate-700 hover:border-indigo-500' : 'bg-slate-900/40 border-slate-800/60'
                        }`}
                      >
                        <div className="text-[10px] font-bold text-slate-300 flex justify-between">
                          <span>{dayNum}</span>
                          {hasActivity && <span className="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>}
                        </div>

                        <div className="space-y-0.5 overflow-hidden">
                          {dayData.actualIncome > 0 && (
                            <div className="bg-emerald-500/20 text-emerald-400 text-[8px] font-extrabold px-1 rounded truncate">
                              +${dayData.actualIncome >= 1000 ? `${(dayData.actualIncome/1000).toFixed(1)}k` : dayData.actualIncome}
                            </div>
                          )}
                          {dayData.actualExpense > 0 && (
                            <div className="bg-rose-500/20 text-rose-400 text-[8px] font-extrabold px-1 rounded truncate">
                              -${dayData.actualExpense >= 1000 ? `${(dayData.actualExpense/1000).toFixed(1)}k` : dayData.actualExpense}
                            </div>
                          )}
                          {dayData.schedExpense > 0 && (
                            <div className="bg-amber-500/20 text-amber-300 text-[8px] font-extrabold px-1 rounded truncate">
                              ⌛-${dayData.schedExpense >= 1000 ? `${(dayData.schedExpense/1000).toFixed(1)}k` : dayData.schedExpense}
                            </div>
                          )}
                          {dayData.schedIncome > 0 && (
                            <div className="bg-cyan-500/20 text-cyan-300 text-[8px] font-extrabold px-1 rounded truncate">
                              ⌛+${dayData.schedIncome >= 1000 ? `${(dayData.schedIncome/1000).toFixed(1)}k` : dayData.schedIncome}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="flex flex-wrap gap-3 pt-2 text-[10px] text-slate-400 border-t border-slate-800">
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500/30 border border-emerald-500/50"></span> {t.actualIncomeLegend}</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-rose-500/30 border border-rose-500/50"></span> {t.actualExpenseLegend}</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-500/30 border border-amber-500/50"></span> {t.pendingBillLegend}</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-cyan-500/30 border border-cyan-500/50"></span> {t.pendingIncomeLegend}</span>
                </div>
              </div>
            )}

            {schedViewMode === 'list' && (
              <div className="glass-card p-3.5 sm:p-4 rounded-2xl space-y-3">
                <h2 className="text-xs sm:text-sm font-bold border-b border-slate-800 pb-2">{t.scheduledRulesList}</h2>
                <div className="space-y-2">
                  {scheduledItems.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500">{t.noScheduledRules}</div>
                  ) : (
                    scheduledItems.map(item => (
                      <div key={item.id} className="p-2.5 sm:p-3 rounded-xl border flex justify-between items-center bg-slate-900/80 border-slate-700">
                        <div className="min-w-0 pr-2">
                          <div className="flex items-center gap-1.5 mb-0.5">
                            <span className="font-bold text-xs text-white truncate">{item.name}</span>
                            <span className={`text-[9px] px-1.5 py-0.5 border rounded-full font-semibold shrink-0 ${getBadgeStyle(item.category, item.type)}`}>
                              {item.type === 'income' ? t.incoming : item.category}
                            </span>
                          </div>
                          <div className="text-[10px] text-slate-400 truncate capitalize">
                            {t.starts} {item.startDate} • {item.frequency || 'monthly'} • ${Number(item.amount).toFixed(2)}
                          </div>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                          <button onClick={() => handleEditScheduledClick(item)} className="text-slate-500 hover:text-amber-400 p-1.5">
                            <i className="fa-solid fa-pen text-xs"></i>
                          </button>
                          <button onClick={() => handleDeleteScheduledItem(item.id)} className="text-slate-600 hover:text-rose-400 p-1.5">
                            <i className="fa-solid fa-trash-can text-xs"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {selectedCalendarDay && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="glass-card max-w-sm w-full rounded-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 className="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                      <i className="fa-solid fa-calendar-day text-indigo-400"></i> {t.dateDetail} {selectedCalendarDay.dateStr}
                    </h3>
                    <button onClick={() => setSelectedCalendarDay(null)} className="text-slate-400 hover:text-white text-sm">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                    <div>
                      <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">{t.loggedTransactions}</span>
                      {selectedCalendarDay.actual.length === 0 ? (
                        <p className="text-[11px] text-slate-500 italic">{t.noLoggedActivity}</p>
                      ) : (
                        selectedCalendarDay.actual.map(a => (
                          <div key={a.id} className="p-2 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center mb-1">
                            <span className="text-xs font-semibold text-white">{a.description}</span>
                            <span className={`text-xs font-bold ${a.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {a.type === 'income' ? '+' : '-'}${Number(a.amount).toFixed(2)}
                            </span>
                          </div>
                        ))
                      )}
                    </div>

                    <div>
                      <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">{t.scheduledRecurringItems}</span>
                      {selectedCalendarDay.scheduled.length === 0 ? (
                        <p className="text-[11px] text-slate-500 italic">{t.noScheduledDue}</p>
                      ) : (
                        selectedCalendarDay.scheduled.map(s => (
                          <div key={s.instanceKey} className="p-2 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center mb-1">
                            <div>
                              <div className="text-xs font-semibold text-white">{s.name}</div>
                              <div className="text-[9px] text-amber-400 capitalize">{s.frequency || 'monthly'} • {s.isProcessed ? t.processed : t.pending}</div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`text-xs font-bold ${s.type === 'income' ? 'text-cyan-400' : 'text-amber-400'}`}>
                                {s.type === 'income' ? '+' : '-'}${Number(s.amount).toFixed(2)}
                              </span>
                              {!s.isProcessed ? (
                                <button
                                  onClick={() => handleProcessScheduledOccurrence(s, selectedCalendarDay.dateStr)}
                                  className={`px-2 py-0.5 border rounded text-[10px] font-bold transition-opacity ${
                                    s.type === 'income'
                                      ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/30'
                                      : 'bg-amber-500/20 text-amber-400 border-amber-500/30 hover:bg-amber-500/30'
                                  }`}
                                >
                                  {s.type === 'income' ? t.receive : t.pay}
                                </button>
                              ) : (
                                <span className="text-[10px] text-emerald-400 font-bold">{t.loggedCheck}</span>
                              )}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <button
                    onClick={() => setSelectedCalendarDay(null)}
                    className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs"
                  >
                    {t.close}
                  </button>
                </div>
              </div>
            )}

          </div>
        )}

        {/* Bottom Navigation */}
        <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-3 py-2 z-[40] flex justify-around items-center max-w-md md:max-w-xl mx-auto rounded-t-2xl shadow-2xl">
          {[
            { id: 'overview', label: t.homeTab, icon: 'fa-house' },
            { id: 'transactions', label: t.historyTab, icon: 'fa-list' },
            { id: 'savings', label: t.savingsTab, icon: 'fa-piggy-bank' },
            { id: 'bills', label: t.scheduledTab, icon: 'fa-calendar' },
            { id: 'networth', label: t.netWorthTab, icon: 'fa-scale-balanced' }
          ].map(tab => (
            <button
              key={tab.id}
              onClick={() => setActiveTab(tab.id)}
              className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-bold transition-all ${
                activeTab === tab.id ? 'text-indigo-400 scale-105' : 'text-slate-500 hover:text-slate-300'
              }`}
            >
              <i className={`fa-solid ${tab.icon} text-base`}></i>
              <span>{tab.label}</span>
            </button>
          ))}
        </nav>

      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HouseholdFinanceHub />);
</script>

</body>
</html>
